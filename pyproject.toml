[project]
name = "mcp-dev-skills"
version = "1.1.0"
description = "Portable MCP server: smart developer skills and rules with sandboxed tools and dynamic discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
mcp-dev-skills = "mcp_dev_skills.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_dev_skills"]
