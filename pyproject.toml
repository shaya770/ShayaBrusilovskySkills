[project]
name = "mcp-dev-skills"
version = "1.0.0"
description = "Portable, model-agnostic MCP server exposing sandboxed developer skills with dynamic tool discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
mcp-dev-skills = "mcp_dev_skills.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_dev_skills"]
